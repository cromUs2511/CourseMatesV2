[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "coursemates-native"
version = "0.1.0"
description = "Native core for CourseMates: rate limiting, abuse scanning, matchmaking"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
build-dir = "build/{wheel_tag}"
wheel.packages = []

# Fail the build on a CMake warning-as-error class of problem rather than
# shipping a wheel that silently lost an optimisation flag.
[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
